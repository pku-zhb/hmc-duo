name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HMC_BUILD_ROOT: ${{ runner.temp }}/duo-build
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Test and assemble development artifacts
        run: ./gradlew --no-daemon --console=plain --max-workers=4 -I tools/gradle-init.gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
